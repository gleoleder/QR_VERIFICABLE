<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin QR - CEAN Capacitación</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="responsive.css" />
    <script>
        // Función para generar QR con logo en el centro
        function generarQRConLogo(containerId, text, logoUrl, size = 400, logoSize = 75) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            
            // Crear QR temporal
            const tempDiv = document.createElement('div');
            tempDiv.style.display = 'none';
            container.appendChild(tempDiv);
            
            new QRCode(tempDiv, {
                text: text,
                width: size,
                height: size,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
            
            // Esperar a que se genere el QR
            setTimeout(() => {
                const qrCanvas = tempDiv.querySelector('canvas');
                const qrImg = tempDiv.querySelector('img');
                
                // Crear canvas final en alta resolución
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = size;
                finalCanvas.height = size;
                const ctx = finalCanvas.getContext('2d');
                
                // Dibujar fondo blanco
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, size, size);
                
                // Dibujar QR
                if (qrCanvas) {
                    ctx.drawImage(qrCanvas, 0, 0, size, size);
                } else if (qrImg) {
                    ctx.drawImage(qrImg, 0, 0, size, size);
                }
                
                // Agregar canvas al container inmediatamente
                container.innerHTML = '';
                container.appendChild(finalCanvas);
                
                // Dibujar logo en el centro
                const logo = new Image();
                logo.crossOrigin = 'anonymous';
                logo.onload = () => {
                    const x = (size - logoSize) / 2;
                    const y = (size - logoSize) / 2;
                    const padding = 7; // Grosor del contorno blanco
                    
                    // Crear canvas temporal para procesar logo
                    const tempLogoCanvas = document.createElement('canvas');
                    tempLogoCanvas.width = logoSize;
                    tempLogoCanvas.height = logoSize;
                    const tempCtx = tempLogoCanvas.getContext('2d');
                    tempCtx.drawImage(logo, 0, 0, logoSize, logoSize);
                    
                    // Obtener imagen con transparencia
                    const logoImageData = tempCtx.getImageData(0, 0, logoSize, logoSize);
                    
                    // Dibujar contorno blanco siguiendo la forma del logo
                    for (let py = 0; py < logoSize; py++) {
                        for (let px = 0; px < logoSize; px++) {
                            const idx = (py * logoSize + px) * 4;
                            const alpha = logoImageData.data[idx + 3];
                            
                            // Si el píxel es parte del logo (no transparente)
                            if (alpha > 50) {
                                // Dibujar contorno blanco en los píxeles vecinos
                                for (let oy = -padding; oy <= padding; oy++) {
                                    for (let ox = -padding; ox <= padding; ox++) {
                                        if (ox === 0 && oy === 0) continue;
                                        
                                        const nx = px + ox;
                                        const ny = py + oy;
                                        
                                        // Verificar límites
                                        if (nx >= 0 && nx < logoSize && ny >= 0 && ny < logoSize) {
                                            const nIdx = (ny * logoSize + nx) * 4;
                                            // Si el vecino es transparente, dibujar contorno blanco
                                            if (logoImageData.data[nIdx + 3] < 50) {
                                                ctx.fillStyle = '#ffffff';
                                                ctx.fillRect(x + nx, y + ny, 1, 1);
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                    
                    // Dibujar logo final sobre el contorno
                    ctx.drawImage(logo, x, y, logoSize, logoSize);
                };
                logo.src = logoUrl;
            }, 100);
        }
    </script>
    <style>

        .icon-lg { width: 24px; height: 24px; }

        .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #d4af37; }

        .result.success { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: white; display: block; }
        .result.error { background: #ffe6e6; color: #cc0000; display: block; }
        .result.loading { background: #f0f0f0; color: #666; display: block; }
        .qr-container { margin-top: 20px; padding: 30px; background: white; border-radius: 15px; display: inline-block; }
        .qr-container > div { display: flex; justify-content: center; align-items: center; }
        .qr-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
        .qr-actions button { padding: 10px 20px; font-size: 13px; background: #6c757d; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .qr-actions button:hover { background: #5a6268; }
        .btn-view-qr { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%) !important; color: white !important; }
        .btn-view-qr:hover { background: linear-gradient(135deg, #b8941f 0%, #e5c035 100%) !important; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,175,55,0.3); }
        .btn-link { background: linear-gradient(135deg, #6c757d 0%, #868e96 100%) !important; color: white !important; }
        .btn-link:hover { background: linear-gradient(135deg, #5a6268 0%, #6c757d 100%) !important; transform: translateY(-2px); }
        .cert-item-actions { display: flex; gap: 8px; margin-top: 10px; }
        .cert-item-actions button { padding: 8px 15px; font-size: 12px; border: none; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .certificados-list { margin-top: 20px; max-height: 400px; overflow-y: auto; }
        .cert-item { background: #f8f9fa; padding: 15px; margin-bottom: 10px; border-radius: 10px; text-align: left; cursor: pointer; transition: all 0.3s; }
        .cert-item:hover { background: #e9ecef; transform: translateX(5px); }
        .cert-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cert-item-name { font-weight: bold; color: #1a1a2e; }
        .cert-item-curso { color: #d4af37; font-size: 13px; }
        .cert-item-info { font-size: 12px; color: #666; }
        .filter-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .filter-group input, .filter-group select { flex: 1; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
        .qr-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .qr-modal { background: white; border-radius: 20px; padding: 40px; max-width: 550px; width: 90%; text-align: center; position: relative; }
        .qr-modal-close { position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; background: #f0f0f0; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .qr-preview { display: flex; justify-content: center; align-items: center; margin: 20px 0; }
        .qr-preview > div { display: inline-block !important; }
        .success-message { background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-top: 15px; display: none; }
        .hidden { display: none !important; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(22,33,62,0.95) 100%); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(10px); }
        .login-card { background: white; border-radius: 24px; padding: 0; max-width: 420px; width: 90%; position: relative; box-shadow: 0 30px 100px rgba(0,0,0,0.4); overflow: hidden; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); padding: 40px 30px; text-align: center; position: relative; }
        .login-header .logo { width: 140px; height: 140px; margin: 0 auto 15px; display: block; filter: drop-shadow(0 0 30px rgba(255,255,255,1)) drop-shadow(0 0 60px rgba(255,255,255,0.9)) drop-shadow(0 0 90px rgba(255,255,255,0.7)) drop-shadow(0 0 120px rgba(255,255,255,0.5)); }
        .login-header h2 { color: white; font-size: 26px; margin: 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .login-header p { color: rgba(255,255,255,0.9); font-size: 14px; margin: 8px 0 0; }
        .login-close { position: absolute; top: 15px; right: 15px; width: 40px; height: 40px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; font-size: 22px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; transition: all 0.3s; padding: 0; }
        .login-close:hover { background: white; color: #d4af37; transform: rotate(90deg); }
        .login-body { padding: 40px 30px; }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 600; font-size: 14px; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 16px 16px 16px 50px; border: 2px solid #e0e0e0; border-radius: 14px; font-size: 15px; transition: all 0.3s; background: #fafafa; }
        .input-wrapper input:focus { outline: none; border-color: #d4af37; background: white; box-shadow: 0 0 0 4px rgba(212,175,55,0.1); }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 18px; color: #999; transition: color 0.3s; }
        .input-wrapper input:focus + .input-icon { color: #d4af37; }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; margin-top: 10px; box-shadow: 0 5px 20px rgba(212,175,55,0.3); }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(212,175,55,0.4); }
        .login-error { background: #ffe6e6; color: #cc0000; padding: 14px 18px; border-radius: 12px; margin-top: 20px; font-size: 14px; display: none; border-left: 4px solid #cc0000; }
        .login-footer { text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid #e0e0e0; font-size: 13px; color: #999; }
    </style>
</head>
<body>
    <!-- LOGIN OVERLAY -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-header">
                <button class="login-close" onclick="closeLogin()" title="Cerrar">×</button>
                <img src="logo-cean.png" alt="CEAN" class="logo" />
                <h2>Acceso Admin</h2>
                <p>Sistema de Certificados CEAN</p>
            </div>
            <div class="login-body">
                <div class="input-group">
                    <label>Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="adminUser" placeholder="Ingresa tu usuario" autocomplete="off" />
                        <span class="input-icon">
                            <svg class="icon" viewBox="0 0 24 24">
                                <circle cx="12" cy="8" r="4" fill="currentColor"/>
                                <path d="M12 14c-6 0-8 3-8 6v2h16v-2c0-6-2-6-8-6z" fill="currentColor"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="adminPass" placeholder="Ingresa tu contraseña" autocomplete="off" />
                        <span class="input-icon">
                            <svg class="icon" viewBox="0 0 24 24">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="currentColor" opacity="0.3"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" fill="none"/>
                                <circle cx="12" cy="16" r="2" fill="currentColor"/>
                            </svg>
                        </span>
                    </div>
                </div>
                <button class="login-btn" onclick="login()">
                    <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="currentColor"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    Ingresar al Sistema
                </button>
                <div id="loginError" class="login-error">
                    <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.2"/>
                        <path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Usuario o contraseña incorrectos
                </div>
                <div class="login-footer">
                    <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" fill="currentColor" opacity="0.3"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" fill="none"/>
                    </svg>
                    Acceso exclusivo para administradores
                </div>
            </div>
        </div>
    </div>

    <!-- QR MODAL -->
    <div id="qrModalOverlay" class="qr-modal-overlay hidden">
        <div class="qr-modal">
            <button class="qr-modal-close" onclick="closeQRModal()">×</button>
            <h3 id="qrModalTitle">Vista Previa del QR</h3>
            <div class="qr-preview">
                <div id="qrModalContent"></div>
            </div>
            <p id="qrModalNombre" style="color: #666; font-size: 14px; margin-top: 15px;"></p>
            <div class="qr-modal-actions" style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn-view-qr" onclick="descargarQRModal()" style="background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 600; cursor: pointer;">
                    <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M13 11.15V4a1 1 0 1 0-2 0v7.15L8.78 8.374a1 1 0 1 0-1.56 1.25l4 5a1 1 0 0 0 1.56 0l4-5a1 1 0 1 0-1.56-1.25L13 11.15Z" clip-rule="evenodd"/>
                        <path fill-rule="evenodd" d="M9.657 15.874 7.358 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2.358l-2.3 2.874a3 3 0 0 1-4.685 0ZM17 16a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17Z" clip-rule="evenodd"/>
                    </svg>
                    Descargar
                </button>
                <button class="btn-link" onclick="closeQRModal()" style="background: linear-gradient(135deg, #6c757d 0%, #868e96 100%); color: white; border: none; padding: 12px 25px; border-radius: 10px; font-weight: 600; cursor: pointer;">
                    <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="container">
        <div class="header-actions">
            <div>
                <img src="logo-cean.png" alt="CEAN" class="logo" />
                <h1>CEAN Capacitación <span id="adminBadge" class="admin-badge">ADMIN</span></h1>
                <p class="subtitle">Gestión de Certificados</p>
            </div>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('generar')">
                <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Generar QR
            </button>
            <button class="tab" onclick="switchTab('buscar')">
                <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Buscar QR
            </button>
        </div>

        <!-- GENERAR QR -->
        <div id="tab-generar" class="tab-content active">
            <div class="form-box">
                <div class="form-group">
                    <label for="nombreAlumno">Nombre del Alumno *</label>
                    <input type="text" id="nombreAlumno" placeholder="Ej: Juan Pérez García" />
                </div>
                <div class="form-group">
                    <label for="cursoSelect">Curso *</label>
                    <div class="search-box" style="margin-bottom: 10px;">
                        <input type="text" id="searchCursoGenerar" placeholder="🔎 Buscar curso por nombre..." onkeyup="buscarCursoParaGenerar()" />
                        <button onclick="buscarCursoParaGenerar()" type="button">
                            <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                                <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                                <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>

                    <label for="horasCurso">Horas del Curso</label>
                    <input type="text" id="horasCurso" placeholder="Ej: 40 horas" readonly />
                </div>

                    <label for="fechaEmision">Fecha de Emisión *</label>
                    <input type="date" id="fechaEmision" />

                <div id="qrResultado" class="result"></div>
                <div id="successMessage" class="success-message"></div>
            </div>
        </div>

        <!-- BUSCAR QR -->
        <div id="tab-buscar" class="tab-content">
            <div class="form-box">
                <div class="filter-group">
                    <input type="text" id="searchNombre" placeholder="Buscar por nombre..." onkeyup="filtrarCertificados()" />
                    <select id="searchCurso" onchange="filtrarCertificados()">
                        <option value="">Todos los cursos</option>
                    </select>
                </div>
                <div class="search-box" style="margin-bottom: 15px;">
                    <input type="text" id="searchCursoTexto" placeholder="🔎 Buscar curso por nombre..." onkeyup="buscarCursoPorTexto()" />

                        <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>

                    <input type="text" id="searchCodigo" placeholder="O busca por código..." onkeyup="filtrarCertificados()" />
                    <button onclick="filtrarCertificados()">
                        <svg class="icon" style="margin-right: 6px;" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        Buscar
                    </button>
                </div>
                <div id="certificadosList" class="certificados-list">
                    <p style="color: #666; text-align: center;">Cargando certificados...</p>
                </div>
            </div>

    </div>

    <script>
        const API_KEY = 'AIzaSyAOhGTjJXHhuUhqf1g2DPCla59xNzftb-Q';
        const SPREADSHEET_ID = '1zB0M4mq956OrfWzGj7Bo73QeM4bp8QNRRk1tagD78Xw';
        const RANGE_READ = 'Certificados!A:E';
        const RANGE_CURSOS = 'Cursos!A:C';
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxLWXUH4IHL8foVJA6L4saLNgVfmllXqqqekNHVhoiw9ocykBzkTIAx1JRkeSOqGAsK8Q/exec';
        const VERIFY_URL = 'https://gleoleder.github.io/QR_CERTIFICADO_CEAN/';

        let ultimoNombreGenerado = '';
        let cursosData = [];
        let certificadosData = [];

        window.onload = async function() {
            const savedAuth = localStorage.getItem('ceanAdminAuth');
            if (savedAuth !== 'true') {
                document.getElementById('loginOverlay').classList.remove('hidden');
            }
            const hoy = new Date().toISOString().split('T')[0];
            document.getElementById('fechaEmision').value = hoy;
            await cargarCursos();
        };

        function openLogin() { document.getElementById('loginOverlay').classList.remove('hidden'); }
        function closeLogin() { document.getElementById('loginOverlay').classList.add('hidden'); }

        function login() {
            const user = document.getElementById('adminUser').value.trim();
            const pass = document.getElementById('adminPass').value.trim();
            if (user === 'admin' && pass === 'admin') {
                localStorage.setItem('ceanAdminAuth', 'true');
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('adminUser').value = '';
                document.getElementById('adminPass').value = '';
                document.getElementById('loginError').style.display = 'none';
                cargarCursos();
                cargarCertificados();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('ceanAdminAuth');
            window.location.reload();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            if (tab === 'buscar') cargarCertificados();
            if (tab === 'generar') cargarCursos();
        }

        async function cargarCursos() {
            const selectGenerar = document.getElementById('cursoSelect');
            const selectBuscar = document.getElementById('searchCurso');
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE_CURSOS}?key=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar cursos');
                const data = await response.json();
                const rows = data.values || [];
                cursosData = rows.slice(1).map(row => ({
                    nombre: row[0] || '',
                    horas: row[1] || '',
                    codigo: row[2] || row[0]?.toLowerCase().replace(/ /g, '-') || ''
                })).filter(c => c.nombre);
            } catch (error) {
                console.log('Usando cursos por defecto');
                cursosData = [
                    { nombre: 'Ley SAFCO', horas: '40 horas', codigo: 'ley-safco' },
                    { nombre: 'Marketing Digital', horas: '30 horas', codigo: 'marketing-digital' },
                    { nombre: 'Excel Avanzado', horas: '20 horas', codigo: 'excel-avanzado' },
                    { nombre: 'Python Básico', horas: '40 horas', codigo: 'python-basico' },
                    { nombre: 'JavaScript', horas: '35 horas', codigo: 'javascript' }
                ];
            }
            selectGenerar.innerHTML = '<option value="">Seleccionar curso...</option>' +
                cursosData.map(c => `<option value="${c.codigo}" data-horas="${c.horas}">${c.nombre} (${c.horas})</option>`).join('');
            selectBuscar.innerHTML = '<option value="">Todos los cursos</option>' +
                cursosData.map(c => `<option value="${c.codigo}">${c.nombre}</option>`).join('');
        }

        async function cargarCertificados() {
            const container = document.getElementById('certificadosList');
            container.innerHTML = '<p style="color: #666; text-align: center;">Cargando certificados...</p>';
            try {
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE_READ}?key=${API_KEY}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Error al cargar certificados');
                const data = await response.json();
                const rows = data.values || [];
                certificadosData = rows.slice(1).map(row => ({
                    codigo: row[0] || '',
                    nombre: row[1] || '',
                    curso: row[2] || '',
                    fecha: row[3] || '',
                    estado: row[4] || 'Activo'
                })).filter(c => c.codigo);
                filtrarCertificados();
            } catch (error) {
                container.innerHTML = '<p style="color: #666; text-align: center;">No hay certificados registrados aún</p>';
            }
        }

        function buscarCursoPorTexto() {
            const texto = document.getElementById('searchCursoTexto').value.toLowerCase();
            const selectCurso = document.getElementById('searchCurso');
            if (!texto) { selectCurso.value = ''; filtrarCertificados(); return; }
            const cursoEncontrado = cursosData.find(c => c.nombre.toLowerCase().includes(texto) || c.codigo.toLowerCase().includes(texto));
            if (cursoEncontrado) { selectCurso.value = cursoEncontrado.codigo; filtrarCertificados(); }
        }

        function buscarCursoParaGenerar() {
            const texto = document.getElementById('searchCursoGenerar').value.toLowerCase();
            const selectCurso = document.getElementById('cursoSelect');
            if (!texto) { selectCurso.value = ''; actualizarHorasCurso(); return; }
            const cursoEncontrado = cursosData.find(c => c.nombre.toLowerCase().includes(texto) || c.codigo.toLowerCase().includes(texto));
            if (cursoEncontrado) { selectCurso.value = cursoEncontrado.codigo; actualizarHorasCurso(); }
        }

        function actualizarHorasCurso() {
            const select = document.getElementById('cursoSelect');
            const selected = select.options[select.selectedIndex];
            const horas = selected.getAttribute('data-horas') || '';
            document.getElementById('horasCurso').value = horas;
        }

        function filtrarCertificados() {
            const searchNombre = document.getElementById('searchNombre').value.toLowerCase();
            const searchCurso = document.getElementById('searchCurso').value;
            const searchCodigo = document.getElementById('searchCodigo').value.toLowerCase();
            const filtrados = certificadosData.filter(cert => {
                const matchNombre = !searchNombre || cert.nombre.toLowerCase().includes(searchNombre);
                const matchCurso = !searchCurso || cert.curso === searchCurso;
                const matchCodigo = !searchCodigo || cert.codigo.toLowerCase().includes(searchCodigo);
                return matchNombre && matchCurso && matchCodigo;
            });
            const container = document.getElementById('certificadosList');
            if (filtrados.length === 0) {
                container.innerHTML = certificadosData.length === 0 ? '<p style="color: #666; text-align: center;">No hay certificados registrados</p>' : '<p style="color: #666; text-align: center;">No se encontraron certificados</p>';
                return;
            }
            container.innerHTML = filtrados.map(cert => `
                <div class="cert-item" onclick="mostrarCertificado('${cert.codigo}')">
                    <div class="cert-item-header">
                        <span class="cert-item-name">${cert.nombre}</span>
                        <span class="cert-item-curso">${cert.curso}</span>
                    </div>
                    <div class="cert-item-info">
                        <svg class="icon" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px;" viewBox="0 0 24 24">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        ${cert.fecha} |
                        <svg class="icon" style="width: 14px; height: 14px; vertical-align: middle; margin: 0 4px;" viewBox="0 0 24 24">
                            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" fill="none"/>
                            <path d="M2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" fill="none"/>
                        </svg>
                        ${cert.codigo} |
                        ${cert.estado === 'Activo' ? '<svg class="icon" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; color: #28a745;" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" fill="none"/><path d="M22 4L12 14.01l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg class="icon" style="width: 14px; height: 14px; vertical-align: middle; margin-right: 4px; color: #ffc107;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 8v4m0 4h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'}
                        ${cert.estado}
                    </div>
                    <div class="cert-item-actions">
                        <button class="btn-view-qr" onclick="event.stopPropagation(); verQRModal('${cert.codigo}', '${cert.nombre}')">
                            <svg style="width: 16px; height: 16px; vertical-align: middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            Ver QR
                        </button>
                        <button class="btn-link" onclick="event.stopPropagation(); copiarLink('${cert.codigo}')">
                            <svg style="width: 16px; height: 16px; vertical-align: middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                            </svg>
                            Link
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function mostrarCertificado(codigo) {
            const cert = certificadosData.find(c => c.codigo === codigo);
            if (!cert) return;
            const verifyLink = `${VERIFY_URL}?codigo=${encodeURIComponent(codigo)}`;
            const qrResultado = document.getElementById('qrResultado');
            qrResultado.className = 'result success';
            qrResultado.innerHTML = `
                <div class="verified-badge">✅</div>
                <h3>Certificado Encontrado</h3>
                <div class="certificate-info" style="color: #155724;">
                    <div class="info-row" style="border-color: rgba(0,0,0,0.1); color: #333;">
                        <span class="info-label">Código:</span>
                        <span class="info-value">${cert.codigo}</span>
                    </div>
                    <div class="info-row" style="border-color: rgba(0,0,0,0.1); color: #333;">
                        <span class="info-label">Nombre:</span>
                        <span class="info-value">${cert.nombre}</span>
                    </div>
                    <div class="info-row" style="border-color: rgba(0,0,0,0.1); color: #333;">
                        <span class="info-label">Curso:</span>
                        <span class="info-value">${cert.curso}</span>
                    </div>
                    <div class="info-row" style="border-color: rgba(0,0,0,0.1); color: #333;">
                        <span class="info-label">Fecha:</span>
                        <span class="info-value">${cert.fecha}</span>
                    </div>
                    <div class="info-row" style="border-color: rgba(0,0,0,0.1); color: #333;">
                        <span class="info-label">Estado:</span>
                        <span class="info-value">${cert.estado}</span>
                    </div>
                </div>
                <div class="qr-container">
                    <div id="qrcode-existente"></div>
                </div>
                <div class="qr-actions">
                    <button onclick="descargarQR()">
                        <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="currentColor">
                            <path fill-rule="evenodd" d="M13 11.15V4a1 1 0 1 0-2 0v7.15L8.78 8.374a1 1 0 1 0-1.56 1.25l4 5a1 1 0 0 0 1.56 0l4-5a1 1 0 1 0-1.56-1.25L13 11.15Z" clip-rule="evenodd"/>
                            <path fill-rule="evenodd" d="M9.657 15.874 7.358 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2.358l-2.3 2.874a3 3 0 0 1-4.685 0ZM17 16a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17Z" clip-rule="evenodd"/>
                        </svg>
                        Descargar QR
                    </button>
                    <button class="btn-secondary" onclick="imprimirCertificado()">
                        <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M6 14h12v8H6z" fill="currentColor" stroke="none"/>
                        </svg>
                        Imprimir
                    </button>
                </div>
                <p style="margin-top: 15px; font-size: 12px; opacity: 0.8;">
                    Enlace: <a href="${verifyLink}" target="_blank" style="color: #155724;">${verifyLink}</a>
                </p>
            `;
            setTimeout(() => {
                generarQRConLogo('qrcode-existente', verifyLink, 'logo-cean.png', 400, 75);
            }, 100);
            switchTab('generar');
        }

        function copiarLink(codigo) {
            const link = `${VERIFY_URL}?codigo=${encodeURIComponent(codigo)}`;
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Link copiado al portapapeles');
            }).catch(() => {
                prompt('Copia este link:', link);
            });
        }

        function verQRModal(codigo, nombre) {
            const verifyLink = `${VERIFY_URL}?codigo=${encodeURIComponent(codigo)}`;
            document.getElementById('qrModalContent').innerHTML = '';
            document.getElementById('qrModalNombre').textContent = nombre;
            document.getElementById('qrModalOverlay').classList.remove('hidden');
            setTimeout(() => {
                generarQRConLogo('qrModalContent', verifyLink, 'logo-cean.png', 400, 75);
            }, 100);
        }

        function closeQRModal() {
            document.getElementById('qrModalOverlay').classList.add('hidden');
            document.getElementById('qrModalContent').innerHTML = '';
        }

        function descargarQRModal() {
            const canvas = document.querySelector('#qrModalContent canvas');
            if (canvas) {
                const modalNom = document.getElementById('qrModalNombre');
                let nombrePersona = modalNom && modalNom.textContent ? modalNom.textContent.trim() : 'Certificado';
                const nombreLimpio = nombrePersona.normalize('NFD').replace(/[^\w\s]/g, '').replace(/\s+/g, '_').substring(0,50);
                const fecha = new Date().toISOString().slice(0,10).replace(/-/g,'');
                const borderWidth = 30;
                const newCanvas = document.createElement('canvas');
                const ctx = newCanvas.getContext('2d');
                newCanvas.width = canvas.width + (borderWidth * 2);
                newCanvas.height = canvas.height + (borderWidth * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                ctx.drawImage(canvas, borderWidth, borderWidth);
                const link = document.createElement('a');
                link.download = nombreLimpio + '_' + fecha + '.png';
                link.href = newCanvas.toDataURL('image/png', 1.0);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function generarCodigoUnico() {
            const timestamp = Date.now().toString(36).toUpperCase();
            const random = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `CERT-${timestamp}-${random}`;
        }

        async function generarCertificado() {
            const nombre = document.getElementById('nombreAlumno').value.trim();
            ultimoNombreGenerado = nombre;
            const curso = document.getElementById('cursoSelect').value;
            const fecha = document.getElementById('fechaEmision').value;
            const estado = document.getElementById('estadoCertificado').value;
            const qrResultado = document.getElementById('qrResultado');
            const successMessage = document.getElementById('successMessage');
            const btn = document.getElementById('btnGenerar');

            if (!nombre) { alert('Ingresa el nombre del alumno'); return; }
            if (!curso) { alert('Selecciona un curso'); return; }
            if (!fecha) { alert('Selecciona la fecha'); return; }

            btn.disabled = true;
            qrResultado.className = 'result loading';
            qrResultado.innerHTML = '<div class="verified-badge">⏳</div><p>Generando...</p>';
            successMessage.style.display = 'none';

            try {
                const codigo = generarCodigoUnico();
                const verifyLink = `${VERIFY_URL}?codigo=${encodeURIComponent(codigo)}`;
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo, nombre, curso: cursosData.find(c => c.codigo === curso)?.nombre || curso, fecha, estado })
                });
                await cargarCertificados();
                qrResultado.className = 'result success';
                qrResultado.innerHTML = `
                    <div class="verified-badge">✅</div>
                    <h3>¡Certificado Generado!</h3>
                    <div class="certificate-info" style="color: #155724;">
                        <div class="info-row" style="border-color: rgba(0,0,0,0.1);">
                            <span class="info-label">Código:</span>
                            <span class="info-value">${codigo}</span>
                        </div>
                        <div class="info-row" style="border-color: rgba(0,0,0,0.1);">
                            <span class="info-label">Nombre:</span>
                            <span class="info-value">${nombre}</span>
                        </div>
                        <div class="info-row" style="border-color: rgba(0,0,0,0.1);">
                            <span class="info-label">Curso:</span>
                            <span class="info-value">${curso}</span>
                        </div>
                    </div>
                    <div class="qr-container">
                        <div id="qrcode"></div>
                    </div>
                    <div class="qr-actions">
                        <button onclick="descargarQR()">
                            <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="currentColor">
                                <path fill-rule="evenodd" d="M13 11.15V4a1 1 0 1 0-2 0v7.15L8.78 8.374a1 1 0 1 0-1.56 1.25l4 5a1 1 0 0 0 1.56 0l4-5a1 1 0 1 0-1.56-1.25L13 11.15Z" clip-rule="evenodd"/>
                                <path fill-rule="evenodd" d="M9.657 15.874 7.358 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2h-2.358l-2.3 2.874a3 3 0 0 1-4.685 0ZM17 16a1 1 0 1 0 0 2h.01a1 1 0 1 0 0-2H17Z" clip-rule="evenodd"/>
                            </svg>
                            Descargar QR
                        </button>
                        <button class="btn-secondary" onclick="imprimirCertificado()">
                            <svg class="icon" style="margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6 14h12v8H6z" fill="currentColor" stroke="none"/>
                            </svg>
                            Imprimir
                        </button>
                    </div>
                    <p style="margin-top: 15px; font-size: 12px; opacity: 0.8;">
                        Link: <a href="${verifyLink}" target="_blank" style="color: white;">${verifyLink}</a>
                    </p>
                `;
                setTimeout(() => {
                    generarQRConLogo('qrcode', verifyLink, 'logo-cean.png', 400, 75);
                }, 100);
                successMessage.style.display = 'block';
                successMessage.innerHTML = '✅ Guardado en la base de datos';
                document.getElementById('nombreAlumno').value = '';
                document.getElementById('cursoSelect').value = '';
                document.getElementById('estadoCertificado').value = 'Activo';
                document.getElementById('horasCurso').value = '';
            } catch (error) {
                qrResultado.className = 'result error';
                qrResultado.innerHTML = `<div class="verified-badge">⚠️</div><h3>Error</h3><p>${error.message}</p>`;
            } finally {
                btn.disabled = false;
            }
        }

        function descargarQR() {
            const canvas = document.querySelector('#qrcode canvas') || document.querySelector('#qrcode-existente canvas') || document.querySelector('#qrModalContent canvas');
            if (canvas) {
                let nombreParaArchivo = ultimoNombreGenerado || '';
                if (!nombreParaArchivo) {
                    const modalNom = document.getElementById('qrModalNombre');
                    if (modalNom && modalNom.textContent && modalNom.textContent.trim() !== '') {
                        nombreParaArchivo = modalNom.textContent.trim();
                    }
                }
                if (!nombreParaArchivo) {
                    const nomInput = document.getElementById('nombreAlumno');
                    if (nomInput && nomInput.value && nomInput.value.trim() !== '') {
                        nombreParaArchivo = nomInput.value.trim();
                    }
                }
                if (!nombreParaArchivo) nombreParaArchivo = 'Certificado';
                const nombreLimpio = nombreParaArchivo.normalize('NFD').replace(/[^\w\s]/g, '').replace(/\s+/g, '_').substring(0, 50);
                const fecha = new Date().toISOString().slice(0,10).replace(/-/g,'');
                const borderWidth = 30;
                const newCanvas = document.createElement('canvas');
                const ctx = newCanvas.getContext('2d');
                newCanvas.width = canvas.width + (borderWidth * 2);
                newCanvas.height = canvas.height + (borderWidth * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, newCanvas.width, newCanvas.height);
                ctx.drawImage(canvas, borderWidth, borderWidth);
                const link = document.createElement('a');
                link.download = nombreLimpio + '_' + fecha + '.png';
                link.href = newCanvas.toDataURL('image/png', 1.0);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        function imprimirCertificado() { window.print(); }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !document.getElementById('loginOverlay').classList.contains('hidden')) {
                login();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeQRModal();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error de Verificación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .error-icon {
            text-align: center;
            font-size: 72px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #e94560;
            font-size: 24px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .error-message {
            color: #666;
            text-align: center;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .error-details {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
        }
        
        .error-details h3 {
            color: #c53030;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .error-details p {
            color: #742a2a;
            font-size: 13px;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .help-box {
            margin-top: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #0f3460;
        }
        
        .help-box h4 {
            color: #0f3460;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .help-box ul {
            color: #666;
            font-size: 13px;
            padding-left: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1>{{ error }}</h1>
        
        <div class="error-details">
            <h3>Detalle del Error</h3>
            <p>{{ message }}</p>
        </div>
        
        <a href="/" class="btn">Nueva Verificación</a>
        
        <div class="help-box">
            <h4>Posibles causas:</h4>
            <ul>
                <li>El token fue ingresado incorrectamente</li>
                <li>El certificado ha sido revocado por la institución</li>
                <li>El certificado ha expirado (si tiene fecha de validez)</li>
                <li>El certificado no existe en nuestro sistema</li>
            </ul>
        </div>
    </div>
</body>
</html>

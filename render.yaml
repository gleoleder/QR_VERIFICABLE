services:
  - type: web
    name: qr-verificable
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: HMAC_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qr-verificable-db
          property: connectionString
      - key: BASE_URL
        fromService:
          name: qr-verificable
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CERTIFICATE_EXPIRY_DAYS
        value: "0"
      - key: INSTITUTION_NAME
        value: "Institución Emisora"
      - key: LOG_LEVEL
        value: "INFO"
databases:
  - name: qr-verificable-db
    databaseName: qr_verificable
    user: qr_user
    plan: free

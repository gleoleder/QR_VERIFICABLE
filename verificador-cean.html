<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Certificados - CEAN Capacitación</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a1a2e;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #d4af37;
        }

        .search-box button {
            padding: 15px 30px;
            background: #d4af37;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #b8941f;
        }

        .search-box button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            border-radius: 15px;
            display: none;
        }

        .result.success {
            background: linear-gradient(135deg, #d4af37 0%, #f4d03f 100%);
            color: white;
            display: block;
            animation: slideIn 0.5s ease;
        }

        .result.error {
            background: #ffe6e6;
            color: #cc0000;
            display: block;
            animation: slideIn 0.5s ease;
        }

        .result.loading {
            background: #f0f0f0;
            color: #666;
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .verified-badge {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .certificate-info {
            text-align: left;
            margin-top: 20px;
        }

        .certificate-info h3 {
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.5);
            padding-bottom: 10px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: bold;
            opacity: 0.9;
        }

        .info-value {
            opacity: 0.95;
        }

        .scan-hint {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            color: #666;
            font-size: 14px;
        }

        .scan-hint strong {
            color: #d4af37;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg class="logo" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#d4af37"/>
            <path d="M50 15 L50 85 M30 35 L50 15 L70 35 M35 50 L65 50 M30 65 L50 85 L70 65" 
                  stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>

        <h1>Verificador de Certificados</h1>
        <p class="subtitle">CEAN Capacitación</p>

        <div class="search-box">
            <input type="text" id="codigoInput" placeholder="Ingresa el código del certificado" />
            <button onclick="verificarCertificado()" id="btnVerificar">Verificar</button>
        </div>

        <div id="resultado" class="result"></div>

        <div class="scan-hint">
            <strong>📱 ¿Escaneaste un QR?</strong><br>
            El código se cargará automáticamente. Si no es así, ingrésalo manualmente arriba.
        </div>
    </div>

    <script>
        // Configuración de la API de Google Sheets
        const API_KEY = 'AIzaSyAOhGTjJXHhuUhqf1g2DPCla59xNzftb-Q';
        const SPREADSHEET_ID = '1zB0M4mq956OrfWzGj7Bo73QeM4bp8QNRRk1tagD78Xw';
        const RANGE = 'Certificados!A:E';

        // Verificar si hay un código en la URL (cuando se escanea QR)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const codigo = urlParams.get('codigo') || urlParams.get('code') || urlParams.get('cert');
            
            if (codigo) {
                document.getElementById('codigoInput').value = codigo;
                verificarCertificado();
            }
        };

        async function verificarCertificado() {
            const codigo = document.getElementById('codigoInput').value.trim();
            const resultado = document.getElementById('resultado');
            const btn = document.getElementById('btnVerificar');

            if (!codigo) {
                resultado.className = 'result error';
                resultado.innerHTML = '<div class="verified-badge">❌</div><p>Por favor ingresa un código de certificado</p>';
                return;
            }

            // Estado de carga
            resultado.className = 'result loading';
            resultado.innerHTML = '<div class="verified-badge">⏳</div><p>Verificando certificado...</p>';
            btn.disabled = true;

            try {
                // Construir URL de la API de Google Sheets
                const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${RANGE}?key=${API_KEY}`;
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('Error al conectar con la base de datos');
                }

                const data = await response.json();
                const rows = data.values || [];

                // Buscar el certificado (asumiendo columna A = código)
                // Ajusta los índices según tu estructura real de columnas
                const certificado = rows.find(row => 
                    row[0] && row[0].toString().trim() === codigo
                );

                if (certificado && certificado.length > 0) {
                    // Éxito - certificado encontrado
                    // Ajusta los índices según tu estructura:
                    // [0]=Código, [1]=Nombre, [2]=Curso, [3]=Fecha, [4]=Estado
                    const nombre = certificado[1] || 'No disponible';
                    const curso = certificado[2] || 'No disponible';
                    const fecha = certificado[3] || 'No disponible';
                    const estado = certificado[4] || 'Activo';

                    resultado.className = 'result success';
                    resultado.innerHTML = `
                        <div class="verified-badge">✅</div>
                        <h3>¡Certificado Verificado!</h3>
                        <div class="certificate-info">
                            <div class="info-row">
                                <span class="info-label">Código:</span>
                                <span class="info-value">${codigo}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Nombre:</span>
                                <span class="info-value">${nombre}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Curso:</span>
                                <span class="info-value">${curso}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Fecha de Emisión:</span>
                                <span class="info-value">${fecha}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Estado:</span>
                                <span class="info-value">${estado}</span>
                            </div>
                        </div>
                    `;
                } else {
                    // Certificado no encontrado
                    resultado.className = 'result error';
                    resultado.innerHTML = `
                        <div class="verified-badge">❌</div>
                        <h3>Certificado No Encontrado</h3>
                        <p>El código <strong>${codigo}</strong> no está registrado en nuestra base de datos.</p>
                        <p style="margin-top: 10px; font-size: 13px;">Verifica el código o contacta a CEAN Capacitación.</p>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
                resultado.className = 'result error';
                resultado.innerHTML = `
                    <div class="verified-badge">⚠️</div>
                    <h3>Error de Conexión</h3>
                    <p>No se pudo conectar con la base de datos. Inténtalo más tarde.</p>
                    <p style="margin-top: 10px; font-size: 13px;">${error.message}</p>
                `;
            } finally {
                btn.disabled = false;
            }
        }

        // Permitir buscar con Enter
        document.getElementById('codigoInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verificarCertificado();
            }
        });
    </script>
</body>
</html>
